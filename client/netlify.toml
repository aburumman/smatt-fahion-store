[build]
  publish = "dist"
  command = "npm run build"

# Proxy API requests to the production backend (Render/Railway/etc)
# Update the 'to' URL once your backend is deployed!
[[redirects]]
  from = "/api/*"
  to = "https://smatt-fashion-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback - Redirect all other requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
